name: REOS CI

on:
  push:
    branches: [main, develop, "claude/**"]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.11"

jobs:
  # ─── Backend ──────────────────────────────────────────────────────────────────
  backend-lint-test:
    name: Backend — Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: reos_test
          POSTGRES_USER: reos_user
          POSTGRES_PASSWORD: reos_test_secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --forceExit
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://reos_user:reos_test_secret@localhost:5432/reos_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_jwt_secret_key
          NEO4J_URI: bolt://localhost:7687
          AI_ENGINE_URL: http://localhost:8000

  # ─── AI Engine ────────────────────────────────────────────────────────────────
  ai-engine-lint-test:
    name: AI Engine — Lint & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ai-engine

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ai-engine/requirements.txt

      - name: Install core deps only (fast)
        run: pip install fastapi pydantic asyncpg numpy scikit-learn

      - name: Test NLP parser (zero-dependency unit test)
        run: |
          python -c "
          import sys; sys.path.insert(0, '.')
          from nlp.smart_search import SmartSearchParser
          p = SmartSearchParser()
          r = p.parse('2BHK under 50L in Pune near metro')
          assert r['bedrooms'] == 2, f'Expected 2, got {r[\"bedrooms\"]}'
          assert r['max_price'] == 5000000, f'Expected 5000000, got {r[\"max_price\"]}'
          assert r['city'] == 'Pune', f'Expected Pune, got {r[\"city\"]}'
          assert 'metro' in r.get('amenities', []), f'Metro not in amenities'
          r2 = p.parse('3BHK villa for rent in Banjara Hills below 40k')
          assert r2['bedrooms'] == 3
          assert r2['listing_type'] == 'rent'
          assert r2['type'] == 'villa'
          assert r2['max_price'] == 40000
          print('All NLP tests passed')
          "

  # ─── Frontend ─────────────────────────────────────────────────────────────────
  frontend-typecheck:
    name: Frontend — Type-check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Type-check
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Lint check
        run: npx next lint --max-warnings 50 || true

  # ─── Docker Build Check ───────────────────────────────────────────────────────
  docker-build:
    name: Docker — Build All Services
    runs-on: ubuntu-latest
    needs: [backend-lint-test, ai-engine-lint-test, frontend-typecheck]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build AI engine image
        uses: docker/build-push-action@v5
        with:
          context: ./ai-engine
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:5000/api
            NEXT_PUBLIC_AI_URL=http://localhost:8000
          cache-from: type=gha
          cache-to: type=gha,mode=max
